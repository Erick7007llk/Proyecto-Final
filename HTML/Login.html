<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/login.css">
    <title>Login</title>
</head>
<body>
    <div class="container">
    <div class="container-form">
        <form class="Sign-in">
          <h2 >Iniciar sesion</h2>
          <div class="icon-networks">
            <ion-icon name="logo-microsoft"></ion-icon>
             <ion-icon name="logo-chrome"></ion-icon> 
          </div>
          <span>Use su correo y contraseña</span>
          <div class="container-input">
            <ion-icon name="mail-outline"></ion-icon>
            <input type="text" placeholder="Correo">
          </div>
          <div class="container-input">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" placeholder="Contraseña">
          </div>
          <a href="#">Olvidaste tu contraseña?</a>
          <button class="button">Iniciar sesión</button>
        </form>
        
    </div>

    <div class="container-form">
        <form class="Sign-up">
          <h2>Registrarse</h2>
          
          <div class="icon-networks">
            <ion-icon name="logo-microsoft"></ion-icon>
             <ion-icon name="logo-chrome"></ion-icon> 
          </div>
          <span>Use su correo electrónico para registrarse</span>
          <div class="container-input">
            <ion-icon name="person-outline"></ion-icon>
            <input type="text" placeholder="Nombre">
          </div>
          <div class="container-input">
            <ion-icon name="mail-outline"></ion-icon>
            <input type="text" placeholder="Correo">
          </div>
          <div class="container-input">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" placeholder="Contraseña">
          </div>
          <button class="button-2">Registrarse</button>
         
        </form>
    </div>

   

<div class="container-welcome">
    <div class="Welcome-Sign-up welcome">
        <h3>Bienvenido!</h3>
        <p>Ingrese sus datos personales para usar todas las funciones del sitio</p>
        <button class="button" id="btn-Sign-up">Registrarse</button>
    </div>
    <div class="Welcome-Sign-in welcome"> 
        <h3>Hola</h3>
        <p>Registrese con sus datos personales para usar todas las funciones del sitio</p>
        <button class="button-2" id="btn-Sign-in">Iniciar sesión</button>
    </div>
</div>


     </div>
    
          
<script src="../backend/Login.js"></script>
<script  type="module"  src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js "></script> 
<script nomodule src=" https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js " ></script>

</body>
</html>
